<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebCEI - Univesp{% endblock %}</title>

    <!-- ACESSIBILIDADE (tema + fonte): aplica as escolhas salvas no localStorage
         ANTES da pagina aparecer, para ela nao abrir no padrao e depois "piscar" -->
    <script>
        (function () {
            var html = document.documentElement;
            try {
                // Tema (Emmanuel): "light", "dark" ou "contrast"
                var tema = localStorage.getItem("tema");
                if (!tema) {
                    tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                html.setAttribute("data-tema", tema);
                html.setAttribute("data-bs-theme", tema === "light" ? "light" : "dark");

                // Tamanho da fonte (Fabio): porcentagem do tamanho padrao (100% = 16px)
                var tamanhoSalvo = parseInt(localStorage.getItem("tamanhoFonte"), 10);
                if (tamanhoSalvo) {
                    html.style.fontSize = tamanhoSalvo + "%";
                }
            } catch (e) {
                html.setAttribute("data-tema", "light");
            }
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* =====================================================================
           MODO ESCURO / ALTO CONTRASTE (Emmanuel)
           Todas as cores do site ficam em variaveis. Cada tema so troca os
           valores; o resto do CSS usa var(--...) e se adapta sozinho.
           O Bootstrap 5.3 tambem troca as cores dele via data-bs-theme.
           ===================================================================== */
        :root,
        [data-tema="light"] {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-light: #f8f9fa;
            --bg-surface: #ffffff;
            --bg-input: #fcfcfc;
            --bg-hover: #f0f7ff;
            --text-main: #333333;
            --text-strong: #212529;
            --border-color: #eeeeee;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --focus-color: #b45309;
            --btn-gradient-start: #2c3e50;
            --btn-gradient-end: #3498db;
        }

        [data-tema="dark"] {
            --primary-color: #9ec5fe;
            --accent-color: #6ea8fe;
            --bg-light: #121821;
            --bg-surface: #1c2430;
            --bg-input: #232d3b;
            --bg-hover: #26364a;
            --text-main: #e3e8ef;
            --text-strong: #f5f7fa;
            --border-color: #2f3b4c;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --focus-color: #ffb347;
            --btn-gradient-start: #2f5d8a;
            --btn-gradient-end: #3d8bd4;
        }

        /* Alto contraste: preto, branco e amarelo, sem sombras nem degrades */
        [data-tema="contrast"] {
            --primary-color: #ffff00;
            --accent-color: #ffff00;
            --bg-light: #000000;
            --bg-surface: #000000;
            --bg-input: #000000;
            --bg-hover: #333300;
            --text-main: #ffffff;
            --text-strong: #ffffff;
            --border-color: #ffffff;
            --shadow-color: transparent;
            --focus-color: #00ffff;
            --btn-gradient-start: #000000;
            --btn-gradient-end: #000000;

            --bs-body-bg: #000000;
            --bs-body-color: #ffffff;
            --bs-secondary-color: #ffffff;
            --bs-tertiary-bg: #000000;
            --bs-secondary-bg: #000000;
            --bs-border-color: #ffffff;
            --bs-link-color: #ffff00;
            --bs-link-color-rgb: 255, 255, 0;
            --bs-link-hover-color: #ffff99;
            --bs-link-hover-color-rgb: 255, 255, 153;
            --bs-emphasis-color: #ffffff;
        }

        [data-tema="contrast"] .card,
        [data-tema="contrast"] .list-group-item,
        [data-tema="contrast"] .table-responsive,
        [data-tema="contrast"] .form-control,
        [data-tema="contrast"] .form-select,
        [data-tema="contrast"] .input-group-text,
        [data-tema="contrast"] .alert {
            border: 2px solid #ffffff !important;
            background: #000000 !important;
            color: #ffffff !important;
        }

        [data-tema="contrast"] .text-muted,
        [data-tema="contrast"] .text-dark,
        [data-tema="contrast"] .text-primary {
            color: #ffffff !important;
        }

        [data-tema="contrast"] a:not(.btn),
        [data-tema="contrast"] .card a h2,
        [data-tema="contrast"] .card a h3 {
            color: #ffff00 !important;
            text-decoration: underline !important;
        }

        [data-tema="contrast"] .btn {
            background: #000000 !important;
            color: #ffff00 !important;
            border: 2px solid #ffff00 !important;
            box-shadow: none !important;
            transform: none !important;
        }

        [data-tema="contrast"] .btn:hover {
            background: #ffff00 !important;
            color: #000000 !important;
        }

        [data-tema="contrast"] .table {
            --bs-table-bg: #000000;
            --bs-table-color: #ffffff;
            --bs-table-hover-bg: #333300;
            --bs-table-hover-color: #ffffff;
        }

        [data-tema="contrast"] .bg-primary-subtle {
            background: #000000 !important;
            border: 2px solid #ffff00;
        }

        [data-tema="contrast"] .form-control::placeholder {
            color: #cccccc;
        }

        /* Botao de tema na barra de cima */
        .theme-controls .btn {
            padding: 0.25rem 0.6rem;
        }
        /* FIM MODO ESCURO / ALTO CONTRASTE (Emmanuel) */

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        /* Container de Conteúdo */
        .main-wrapper {
            flex: 1;
            padding-top: 2rem;
            padding-bottom: 3rem;
        }

        /* Superficies (header, footer, cards) seguem o tema */
        .surface {
            background-color: var(--bg-surface) !important;
        }

        /* Estilização Global de Cards (Uso comum em Dashboards)
           ALTERADO (Fabio): medidas em rem para crescerem junto com a fonte */
        .card {
            border: none;
            border-radius: 0.75rem;
            background-color: var(--bg-surface);
            box-shadow: 0 0.25rem 0.75rem var(--shadow-color);
            transition: transform 0.2s;
        }

        /* Estilização de Tabelas */
        .table-responsive {
            border-radius: 0.75rem;
            background: var(--bg-surface);
            padding: 1rem;
            box-shadow: 0 0.125rem 0.5rem var(--shadow-color);
        }

        /* Botões Arredondados */
        .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            padding: 0.5rem 1.2rem;
        }

        /* Transições suaves */
        .nav-link { transition: all 0.3s ease; }

        /* Icones redondos dos cabecalhos dos cards (antes 64px fixo) */
        .icon-shape {
            width: 4rem;
            height: 4rem;
        }

        /* =====================================================================
           TAMANHO DAS LETRAS (Fabio)
           Botoes A-, A e A+ da barra de cima. O botao fica apagado (disabled)
           quando chega no limite.
           ===================================================================== */
        .font-controls {
            display: flex;
            gap: 0.25rem;
        }

        .font-controls .btn {
            font-size: 0.875rem;
            min-width: 2.5rem;
            padding: 0.25rem 0.5rem;
        }

        .font-controls .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* FIM TAMANHO DAS LETRAS (Fabio) */

        /* =====================================================================
           NAVEGACAO POR TECLADO (Firmo)
           Contorno bem visivel em qualquer elemento focado com Tab.
           ===================================================================== */
        :focus-visible {
            outline: 3px solid var(--focus-color) !important;
            outline-offset: 3px;
            box-shadow: none !important;
        }

        /* Link "Pular para o conteudo": fica escondido ate receber foco */
        .skip-link {
            position: absolute;
            left: 1rem;
            top: -10rem;
            z-index: 2000;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--bg-surface);
            color: var(--text-strong);
            font-weight: 600;
        }

        .skip-link:focus {
            top: 1rem;
        }
        /* FIM NAVEGACAO POR TECLADO (Firmo) */
    </style>
</head>
<body>

    <!-- NOVO (Firmo): atalho para quem navega com teclado/leitor de tela -->
    <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>

    {% include "partials/top_bar.html" %}

    <main id="conteudo" class="main-wrapper" tabindex="-1">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% include "partials/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // JavaScript para interações modernas
        document.addEventListener('DOMContentLoaded', function() {
            // Tooltips do Bootstrap
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            });

            // Feedback visual ao clicar em botões de salvar
            const saveBtns = document.querySelectorAll('.btn-primary');
            saveBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    if(this.innerText.includes('Salvar') || this.innerText.includes('Enviar')) {
                        const originalText = this.innerHTML;
                        this.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Aguarde...`;
                        setTimeout(() => this.innerHTML = originalText, 2000);
                    }
                });
            });
        });
    </script>

    <!-- =====================================================================
         MODO ESCURO / ALTO CONTRASTE (Emmanuel)
         O botao da barra de cima alterna: claro -> escuro -> alto contraste.
         A escolha fica salva no localStorage para nao perder ao trocar de pagina.
         ===================================================================== -->
    <script>
        (function () {
            var html = document.documentElement;
            var botao = document.getElementById("theme-toggle");
            if (!botao) return;

            var TEMAS = ["light", "dark", "contrast"];
            var INFO = {
                light:    { icone: "bi-moon-stars-fill", texto: "Escuro",    rotulo: "Tema atual: claro. Mudar para modo escuro" },
                dark:     { icone: "bi-circle-half",     texto: "Contraste", rotulo: "Tema atual: escuro. Mudar para alto contraste" },
                contrast: { icone: "bi-sun-fill",        texto: "Claro",     rotulo: "Tema atual: alto contraste. Mudar para modo claro" }
            };

            function aplicar(tema, salvar) {
                if (TEMAS.indexOf(tema) === -1) tema = "light";
                html.setAttribute("data-tema", tema);
                html.setAttribute("data-bs-theme", tema === "light" ? "light" : "dark");

                var info = INFO[tema];
                botao.querySelector("i").className = "bi " + info.icone;
                botao.querySelector(".theme-label").textContent = info.texto;
                botao.setAttribute("aria-label", info.rotulo);
                botao.setAttribute("title", info.rotulo);

                if (salvar) {
                    try { localStorage.setItem("tema", tema); } catch (e) {}
                }
            }

            botao.addEventListener("click", function () {
                var atual = html.getAttribute("data-tema") || "light";
                var proximo = TEMAS[(TEMAS.indexOf(atual) + 1) % TEMAS.length];
                aplicar(proximo, true);
            });

            aplicar(html.getAttribute("data-tema") || "light", false);
        })();
    </script>
    <!-- FIM MODO ESCURO / ALTO CONTRASTE (Emmanuel) -->

    <!-- =====================================================================
         TAMANHO DAS LETRAS (Fabio)
         Cada clique muda o tamanho da fonte do <html> em 10% (entre 80% e 150%)
         e salva no localStorage. Como o CSS usa rem, tudo cresce junto.
         ===================================================================== -->
    <script>
        (function () {
            var PADRAO = 100;  // 100% = 16px
            var PASSO = 10;
            var MINIMO = 80;
            var MAXIMO = 150;

            var html = document.documentElement;
            var botaoMenos = document.getElementById("font-decrease");
            var botaoNormal = document.getElementById("font-reset");
            var botaoMais = document.getElementById("font-increase");
            if (!botaoMenos || !botaoNormal || !botaoMais) return;

            var atual = parseInt(html.style.fontSize, 10) || PADRAO;

            function aplicar(tamanho) {
                atual = Math.min(MAXIMO, Math.max(MINIMO, tamanho));
                html.style.fontSize = atual + "%";
                botaoMenos.disabled = atual <= MINIMO;
                botaoMais.disabled = atual >= MAXIMO;
                try {
                    localStorage.setItem("tamanhoFonte", atual);
                } catch (e) {}
            }

            botaoMenos.addEventListener("click", function () { aplicar(atual - PASSO); });
            botaoMais.addEventListener("click", function () { aplicar(atual + PASSO); });
            botaoNormal.addEventListener("click", function () { aplicar(PADRAO); });

            aplicar(atual);
        })();
    </script>

    <!-- VLibras (Fabio): widget do governo que traduz o conteudo do site para Libras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        try { new window.VLibras.Widget("https://vlibras.gov.br/app"); } catch (e) {}
    </script>
    <!-- FIM TAMANHO DAS LETRAS / VLIBRAS (Fabio) -->
</body>
</html>
