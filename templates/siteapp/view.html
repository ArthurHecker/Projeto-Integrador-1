{% extends "base.html" %}

{% block title %}Detalhes do Evento{% endblock %}

{% block content %}
<h1>Detalhes do Evento</h1>

{% if evento %}
    <div class="card">
        <h2>{{ evento.nome }}</h2>
        <p>Data: {{ evento.data }}</p>

        <h3>Presenças (Em Breve)</h3>
        <p>Nome dos pais presentes</p>
    </div>
{% else %}
    <p class="error">Evento não encontrado!</p>
{% endif %}
{% endblock %}
