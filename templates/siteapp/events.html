{% extends "base.html" %}

{% block title %}Eventos{% endblock %}

{% block content %}
<h1>Criar Evento</h1>

<form method="POST">
    {% csrf_token %}

    <label for="nome">Nome da reunião</label><br>
    <input type="text" id="nome" name="nome" placeholder="Nome da reunião" required><br><br>
    <label for="data">Data da reunião</label><br>
    <input type="date" id="data" name="data" required><br><br>
    <button type="submit">Criar</button>
</form>

<hr>

<h2>Eventos Criados</h2>

{% for evento in events %}
    <div class="card" style="margin: 10px 0;">
        <h3>{{ evento.nome }}</h3>
        <p>{{ evento.data }}</p>
        <a href="{% url 'view_event' evento.id %}">
            Ver Presenças
        </a>
    </div>
{% empty %}
    <p>Nenhum evento cadastrado.</p>
{% endfor %}

{% endblock %}
